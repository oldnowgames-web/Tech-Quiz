<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Quiz - Conhecimento e Inovação</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS do jogo -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="min-h-screen flex flex-col justify-between selection:bg-neon-cyan selection:text-space-900">

    <!-- Fundo animado -->
    <canvas id="technologyNetwork"></canvas>

    <!-- Aplicação -->
    <div id="app" class="w-full max-w-6xl mx-auto px-4 py-6 md:py-10 flex flex-col flex-grow relative z-10">

        <!-- Cabeçalho -->
        <header class="flex flex-col md:flex-row items-center justify-between mb-8 pb-4 border-b border-indigo-900/50 gap-4">

            <div class="flex items-center space-x-3 cursor-pointer"
                 onclick="appState.showStart()"
                 role="button"
                 tabindex="0"
                 aria-label="Voltar à tela inicial">

                <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-neon-cyan to-neon-purple flex items-center justify-center text-space-900 font-bold text-2xl shadow-lg shadow-neon-cyan/20 animate-glow">
                    <i class="fa-solid fa-microchip"></i>
                </div>

                <div>
                    <h1 class="text-2xl md:text-3xl font-extrabold tracking-wider bg-gradient-to-r from-neon-cyan via-white to-neon-purple bg-clip-text text-transparent">
                        TECH QUIZ
                    </h1>

                    <p class="text-xs text-slate-400 font-medium tracking-widest uppercase">
                        Tecnologia, inovação e conhecimento digital
                    </p>
                </div>
            </div>

            <div class="flex items-center space-x-3 flex-wrap justify-center">

                <div class="glass-card px-3 py-2 rounded-xl flex items-center space-x-2 text-xs md:text-sm text-slate-300">
                    <i class="fa-solid fa-layer-group text-neon-cyan"></i>
                    <span>10 Categorias</span>
                </div>

                <div class="glass-card px-3 py-2 rounded-xl flex items-center space-x-2 text-xs md:text-sm text-slate-300">
                    <i class="fa-solid fa-brain text-neon-purple"></i>
                    <span>100 Questões</span>
                </div>

                <button
                    id="menu-toggle"
                    type="button"
                    onclick="appState.toggleMenu()"
                    class="menu-top-btn px-4 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2"
                    aria-controls="quick-menu"
                    aria-expanded="false"
                    aria-label="Abrir menu">

                    <i class="fa-solid fa-bars-staggered"></i>
                    <span class="menu-btn-label">MENU</span>
                </button>

            </div>
        </header>

        <!-- Menu -->
        <nav id="quick-menu" class="quick-menu" aria-label="Menu principal" aria-hidden="true">

            <div class="quick-menu-head">
                <div>
                    <span class="quick-menu-kicker">CENTRAL DE COMANDO</span>
                    <h2>Menu do jogo</h2>
                </div>

                <button type="button" class="quick-menu-close" onclick="appState.closeMenu()" aria-label="Fechar menu">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <button type="button" class="quick-menu-item" onclick="appState.showCategories()">
                <span class="quick-menu-icon cyan"><i class="fa-solid fa-layer-group"></i></span>
                <span>
                    <b>Assuntos</b>
                    <small>Explorar as 10 categorias</small>
                </span>
                <i class="fa-solid fa-chevron-right"></i>
            </button>

            <button type="button" class="quick-menu-item" onclick="appState.showStats()">
                <span class="quick-menu-icon gold"><i class="fa-solid fa-chart-line"></i></span>
                <span>
                    <b>Meu progresso</b>
                    <small>Ver pontuações e desempenho</small>
                </span>
                <i class="fa-solid fa-chevron-right"></i>
            </button>

            <button type="button" class="quick-menu-item" onclick="appState.showSettings()">
                <span class="quick-menu-icon violet"><i class="fa-solid fa-sliders"></i></span>
                <span>
                    <b>Configurações</b>
                    <small>Som e efeitos visuais</small>
                </span>
                <i class="fa-solid fa-chevron-right"></i>
            </button>

            <button type="button" class="quick-menu-item" onclick="appState.showHowTo()">
                <span class="quick-menu-icon green"><i class="fa-solid fa-book-open"></i></span>
                <span>
                    <b>Como jogar</b>
                    <small>Consulte as regras</small>
                </span>
                <i class="fa-solid fa-chevron-right"></i>
            </button>

            <button type="button" class="quick-menu-item" onclick="appState.showAbout()">
                <span class="quick-menu-icon pink"><i class="fa-solid fa-laptop-code"></i></span>
                <span>
                    <b>Sobre o projeto</b>
                    <small>Conheça o Tech Quiz</small>
                </span>
                <i class="fa-solid fa-chevron-right"></i>
            </button>

            <div class="quick-menu-foot">
                <i class="fa-solid fa-circle-info"></i>
                O menu pode ser aberto em qualquer tela.
            </div>

        </nav>

        <!-- Conteúdo dinâmico -->
        <main id="view-container" class="flex-grow flex flex-col justify-center">
            <!-- O JavaScript carrega as telas aqui -->
        </main>

        <!-- Rodapé -->
        <footer class="mt-12 pt-6 border-t border-indigo-900/50 text-center text-xs text-slate-500 flex flex-col md:flex-row justify-between items-center gap-2">

            <p>© 2026 Tech Quiz • Explorando o Mundo da Tecnologia</p>

            <p class="text-slate-400 font-medium">
                Conhecimento, inovação e tecnologia em um só lugar ⚡
            </p>

        </footer>

    </div>

    <!-- JavaScript do jogo -->
    <script src="script.js"></script>

</body>
</html>
